<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy 4th Monthsary Koko Pu Kyu</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@600;700&family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        .font-handwriting {
            font-family: 'Dancing Script', cursive;
        }
        .font-letter-body {
            font-family: 'Caveat', cursive;
        }

        /* Ambient floating hearts background */
        .bg-heart {
            position: absolute;
            color: rgba(244, 114, 182, 0.25);
            animation: floatUp linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 0.8; }
            100% {
                transform: translateY(-15vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Card / Modal Internal Transparent Floating Colored Hearts */
        .card-heart-float {
            position: absolute;
            animation: cardFloatUp linear infinite;
            pointer-events: none;
            opacity: 0.35;
        }

        @keyframes cardFloatUp {
            0% {
                transform: translateY(100%) scale(0.6) rotate(0deg);
                opacity: 0;
            }
            30% {
                opacity: 0.45;
            }
            100% {
                transform: translateY(-120%) scale(1.1) rotate(360deg);
                opacity: 0;
            }
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(253, 242, 248, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #f472b6;
            border-radius: 10px;
        }

        /* Pulse glow for gift box */
        .pulse-glow {
            animation: pulseGlow 2s infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(244, 114, 182, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(244, 114, 182, 0.8)); }
        }

        /* 3D Box & Lid animations */
        .gift-lid {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }
        .gift-box-open .gift-lid {
            transform: translateY(-130px) rotate(-15deg) scale(0.9);
            opacity: 0;
        }

        /* Envelope animation */
        .envelope-wrapper {
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Perfect Heart Clip Mask */
        .heart-mask {
            clip-path: url(#heart-clip-path);
            -webkit-clip-path: url(#heart-clip-path);
        }

        /* Gentle Heart Photo Floating Motion */
        .float-photo-item {
            animation: floatSmooth 4.5s ease-in-out infinite alternate;
        }
        @keyframes floatSmooth {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        /* Typewriter Cursor */
        .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #ec4899;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-rose-100 via-pink-50 to-purple-100 min-h-screen min-h-[100dvh] flex items-center justify-center overflow-hidden relative selection:bg-pink-200 selection:text-pink-700">

    <!-- Global SVG Filter Definition for Perfect Heart Shape Clip -->
    <svg width="0" height="0" class="absolute">
      <defs>
        <clipPath id="heart-clip-path" clipPathUnits="objectBoundingBox">
          <path d="M 0.5, 0.28 C 0.5, 0.28 0.415, 0 0.25, 0 C 0.1, 0 0, 0.14 0, 0.31 C 0, 0.55 0.28, 0.77 0.5, 0.95 C 0.72, 0.77 1, 0.55 1, 0.31 C 1, 0.14 0.9, 0 0.75, 0 C 0.585, 0 0.5, 0.28 0.5, 0.28 Z"></path>
        </clipPath>
      </defs>
    </svg>

    <!-- Background Audio -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/08/02/audio_884fe92c21.mp3" type="audio/mpeg">
    </audio>

    <!-- Ambient Floating Hearts Overlay -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full max-w-lg px-4 flex flex-col items-center justify-center min-h-[100dvh]">

        <!-- STEP 1: Interactive Gift Box -->
        <div id="step-box" class="flex flex-col items-center cursor-pointer group transition-all duration-300">
            <div id="box-wrapper" class="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center pulse-glow">
                
                <!-- Lid -->
                <div class="gift-lid absolute top-2 sm:top-4 z-20 w-44 sm:w-52 h-14 sm:h-16 bg-gradient-to-r from-pink-400 to-rose-400 rounded-t-lg shadow-md flex items-center justify-center border-b-2 border-pink-500">
                    <div class="w-8 sm:w-10 h-full bg-rose-200/80 shadow-inner"></div>
                    <div class="absolute -top-5 sm:-top-6 flex items-center justify-center">
                        <div class="w-7 sm:w-8 h-7 sm:h-8 border-4 border-rose-300 rounded-full rotate-45 transform border-r-transparent shadow-sm"></div>
                        <div class="w-7 sm:w-8 h-7 sm:h-8 border-4 border-rose-300 rounded-full -rotate-45 transform border-l-transparent shadow-sm -ml-3"></div>
                    </div>
                </div>

                <!-- Box Base -->
                <div class="absolute bottom-4 z-10 w-40 sm:w-48 h-36 sm:h-40 bg-gradient-to-br from-pink-300 to-rose-300 rounded-b-xl shadow-2xl border-t-2 border-pink-200 flex justify-center">
                    <div class="w-8 sm:w-10 h-full bg-rose-200/80 shadow-inner"></div>
                </div>
            </div>

            <!-- Tap Badge -->
            <div class="mt-6 px-6 py-2.5 bg-white/80 backdrop-blur-md rounded-full shadow-lg border border-pink-200 flex items-center gap-2 transform group-hover:scale-105 transition-transform">
                <i class="fa-solid fa-hand-pointer text-pink-500 animate-bounce"></i>
                <span class="text-pink-600 font-semibold tracking-wide text-sm sm:text-base">Tap to open</span>
            </div>
        </div>

        <!-- STEP 2: Letter Envelope -->
        <div id="step-envelope" class="hidden flex-col items-center opacity-0 transform scale-75 envelope-wrapper cursor-pointer">
            <div class="relative w-64 h-44 sm:w-72 sm:h-48 bg-rose-200 rounded-lg shadow-xl border border-rose-300 flex items-center justify-center overflow-hidden group hover:scale-105 transition-transform">
                <div class="absolute inset-0 bg-gradient-to-b from-rose-300 to-pink-200"></div>
                
                <div class="absolute top-4 w-52 sm:w-60 h-32 bg-white rounded-t shadow-md flex flex-col items-center pt-3 px-4 transform group-hover:-translate-y-2 transition-transform">
                    <div class="w-12 h-1 bg-pink-200 rounded mb-2"></div>
                    <div class="w-full h-1 bg-pink-100 rounded mb-1"></div>
                    <div class="w-3/4 h-1 bg-pink-100 rounded"></div>
                    <span class="mt-2 text-pink-500 font-handwriting text-xl font-bold">To my Koko Pu Kyu 🩷</span>
                </div>

                <div class="absolute inset-0 border-t-[90px] sm:border-t-[100px] border-t-transparent border-l-[128px] sm:border-l-[144px] border-l-rose-200/90 border-r-[128px] sm:border-r-[144px] border-r-rose-200/90 border-b-[90px] sm:border-b-[100px] border-b-rose-300 pointer-events-none"></div>

                <div class="absolute z-20 w-11 h-11 bg-gradient-to-tr from-pink-500 to-rose-500 rounded-full flex items-center justify-center shadow-lg border-2 border-white/80 animate-pulse">
                    <i class="fa-solid fa-heart text-white text-base"></i>
                </div>
            </div>

            <div class="mt-6 px-6 py-2.5 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-pink-200 flex items-center gap-2">
                <i class="fa-solid fa-envelope-open-text text-pink-500"></i>
                <span class="text-pink-600 font-semibold tracking-wide text-sm sm:text-base">Tap letter to read</span>
            </div>
        </div>

        <!-- STEP 3: Full Screen Letter Container -->
        <div id="step-letter" class="hidden fixed inset-0 z-40 flex items-center justify-center p-3 sm:p-6 bg-black/40 backdrop-blur-sm opacity-0 transition-opacity duration-500">
            
            <div class="relative w-full max-w-xl max-h-[88vh] sm:max-h-[85vh] bg-pink-50/95 backdrop-blur-md rounded-2xl shadow-2xl border-2 border-pink-200 flex flex-col overflow-hidden">
                
                <!-- Header -->
                <div class="p-3 sm:p-5 border-b border-pink-200/60 bg-white/60 flex items-center justify-between shrink-0 z-10">
                    <div class="flex items-center gap-2">
                        <span class="text-xs sm:text-sm px-3 py-1 bg-pink-100 text-pink-600 font-medium rounded-full">
                            ✨ Happy 4th Monthsary
                        </span>
                    </div>

                    <button id="memories-btn" onclick="toggleMemoriesModal()" class="px-3.5 py-1.5 sm:px-4 sm:py-2 bg-gradient-to-r from-pink-500 to-rose-500 text-white font-medium text-xs sm:text-sm rounded-full shadow-md hover:shadow-lg active:scale-95 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-camera-retro"></i>
                        <span>📸 Our Memories</span>
                    </button>
                </div>

                <!-- Text Content Container -->
                <div class="relative p-4 sm:p-8 overflow-y-auto custom-scrollbar flex-1">
                    
                    <!-- Internal Floating Hearts -->
                    <div id="letter-floating-hearts" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

                    <!-- Text Overlay -->
                    <div class="relative z-10">
                        <h1 class="text-3xl sm:text-4xl font-bold text-pink-600 mb-4 font-handwriting tracking-wide drop-shadow-sm">
                            To my Koko Pu Kyu 🩷🥺
                        </h1>

                        <div id="typewriter-content" class="text-gray-800 text-xl sm:text-2xl leading-relaxed font-letter-body whitespace-pre-line font-bold drop-shadow-sm"></div>
                        <span id="cursor" class="cursor-blink"></span>
                    </div>
                </div>

                <div class="p-2 sm:p-3 bg-white/60 border-t border-pink-200/40 text-center text-xs text-pink-400 font-medium z-10">
                    Made with ❤️ for Koko
                </div>

            </div>
        </div>

    </main>

    <!-- STEP 4: Memories Gallery Modal (With Background Floating Transparent Hearts) -->
    <div id="memories-modal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex flex-col opacity-0 transition-opacity duration-300 overflow-hidden">
        
        <!-- Gallery Background Transparent Floating Hearts Overlay -->
        <div id="gallery-floating-hearts" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

        <!-- Header Bar -->
        <div class="p-4 flex items-center justify-between text-white z-20 bg-gradient-to-b from-black/80 to-transparent shrink-0">
            <div>
                <h2 class="text-2xl sm:text-3xl font-bold font-handwriting text-pink-300">Our Sweet Memories 💞</h2>
                <p class="text-xs text-gray-300">Tap any photo to view full picture</p>
            </div>
            <button onclick="toggleMemoriesModal()" class="w-10 h-10 bg-white/20 hover:bg-white/30 rounded-full flex items-center justify-center text-white backdrop-blur-md transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <!-- Scrollable Gallery Area (Neat Grid Spacing) -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 z-10">
            <div id="floating-gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-4 sm:gap-6 justify-items-center items-center">
                <!-- 32 Heart-Shaped Photos -->
            </div>
        </div>
    </div>

    <!-- STEP 5: Full Photo Lightbox Popup Modal -->
    <div id="lightbox-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-lg flex items-center justify-center p-4 opacity-0 transition-opacity duration-300" onclick="closeLightbox()">
        <div class="relative max-w-full max-h-full flex flex-col items-center" onclick="event.stopPropagation()">
            <!-- Close Button -->
            <button onclick="closeLightbox()" class="absolute -top-12 right-0 w-10 h-10 bg-white/20 text-white rounded-full flex items-center justify-center hover:bg-white/40 transition-colors">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <!-- Big Image Frame -->
            <div class="p-2 bg-gradient-to-r from-pink-400 to-rose-400 rounded-2xl shadow-2xl">
                <img id="lightbox-img" src="" alt="Full Photo Preview" class="max-w-[90vw] max-h-[75vh] sm:max-h-[80vh] object-contain rounded-xl shadow-md">
            </div>
            <span id="lightbox-caption" class="mt-3 text-pink-200 text-lg font-medium font-handwriting"></span>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        const fullLetterText = `Happy 4th monthsary to usss naw

Can’t believe it’s already been 4 months. Maybe fate pulled us apart once 🙄 but somehow we found our way back to each other and this time I really wanna make it work. 🥹🤍

I know we won’t be perfect all the time but that’s okay. I just want us to keep growing, understanding each other, and choosing each other even on the hard days nawww. 😚 I just wanna be there for your happiest moments and your shittiest days too hehe😂Whenever life gets heavy you’ll always have a safe place in me pr Koko yayyyy🫶🏻

Andddd, you may not be my first love but I really hope you’re my last loveeee. 🙈I can’t promise we’ll always have perfect days but I can promise to love you faithfully, keep choosing us, and never stop learning how to love you better par 

Thank chuuu  for being here and giving me another chance Koko. And here’s to more months, more memories, more laughter, more love naw pinky promise. 😭🩷

Myr g chit tel naw. Happy 4th monthsary par my favorite person lay .Please don’t ever forget that naw. Mwahhh 💋🤍`;

        const stepBox = document.getElementById('step-box');
        const boxWrapper = document.getElementById('box-wrapper');
        const stepEnvelope = document.getElementById('step-envelope');
        const stepLetter = document.getElementById('step-letter');
        const bgAudio = document.getElementById('bg-music');
        const typewriterContainer = document.getElementById('typewriter-content');
        const cursor = document.getElementById('cursor');

        let typewriterStarted = false;
        let isAudioPlaying = false;

        function triggerAudioPlay() {
            if (bgAudio && !isAudioPlaying) {
                bgAudio.volume = 0.85;
                bgAudio.play().then(() => {
                    isAudioPlaying = true;
                }).catch(e => {
                    console.log("Audio waiting for user click.");
                });
            }
        }

        document.body.addEventListener('click', triggerAudioPlay, { once: false });

        function createAmbientHearts() {
            const heartsContainer = document.getElementById('hearts-container');
            const heartIcons = ['fa-heart', 'fa-heart font-regular', 'fa-sparkles'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('i');
                const randomIcon = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                heart.className = `fa-solid ${randomIcon} bg-heart`;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${5 + Math.random() * 7}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${12 + Math.random() * 20}px`;
                heartsContainer.appendChild(heart);
            }
        }
        createAmbientHearts();

        // Helper to generate Transparent Floating Hearts inside Containers
        function populateFloatingHearts(targetId, count = 18) {
            const container = document.getElementById(targetId);
            if (!container) return;
            const colors = ['text-pink-400', 'text-rose-400', 'text-purple-400', 'text-red-400', 'text-pink-300', 'text-fuchsia-400'];
            
            for (let i = 0; i < count; i++) {
                const heart = document.createElement('i');
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                heart.className = `fa-solid fa-heart card-heart-float ${randomColor}`;
                heart.style.left = `${Math.random() * 95}%`;
                heart.style.animationDuration = `${4 + Math.random() * 5}s`;
                heart.style.animationDelay = `${Math.random() * 4}s`;
                heart.style.fontSize = `${14 + Math.random() * 22}px`;
                container.appendChild(heart);
            }
        }

        populateFloatingHearts('letter-floating-hearts', 15);
        populateFloatingHearts('gallery-floating-hearts', 25);

        // Step 1: Open Box
        stepBox.addEventListener('click', () => {
            triggerAudioPlay();
            boxWrapper.classList.add('gift-box-open');
            
            confetti({
                particleCount: 70,
                spread: 60,
                origin: { y: 0.6 }
            });

            setTimeout(() => {
                stepBox.classList.add('hidden');
                stepEnvelope.classList.remove('hidden');
                setTimeout(() => {
                    stepEnvelope.classList.remove('opacity-0', 'scale-75');
                }, 50);
            }, 600);
        });

        // Step 2: Open Envelope
        stepEnvelope.addEventListener('click', () => {
            triggerAudioPlay();
            stepEnvelope.classList.add('opacity-0', 'scale-75');
            
            setTimeout(() => {
                stepEnvelope.classList.add('hidden');
                stepLetter.classList.remove('hidden');
                setTimeout(() => {
                    stepLetter.classList.remove('opacity-0');
                    if (!typewriterStarted) {
                        typewriterStarted = true;
                        startTypewriter();
                    }
                }, 50);
            }, 500);
        });

        // Step 3: Typewriter Effect
        function startTypewriter() {
            let index = 0;
            const speed = 35;

            function typeNextChar() {
                if (index < fullLetterText.length) {
                    typewriterContainer.textContent += fullLetterText.charAt(index);
                    index++;
                    setTimeout(typeNextChar, speed);
                } else {
                    cursor.style.display = 'none';
                }
            }
            typeNextChar();
        }

        // Step 4: Memories Gallery
        const memoriesModal = document.getElementById('memories-modal');
        const galleryGrid = document.getElementById('floating-gallery-grid');
        let galleryPopulated = false;

        function toggleMemoriesModal() {
            triggerAudioPlay();
            if (memoriesModal.classList.contains('hidden')) {
                memoriesModal.classList.remove('hidden');
                setTimeout(() => memoriesModal.classList.remove('opacity-0'), 10);
                
                if (!galleryPopulated) {
                    generateGalleryPhotos();
                    galleryPopulated = true;
                }
            } else {
                memoriesModal.classList.add('opacity-0');
                setTimeout(() => memoriesModal.classList.add('hidden'), 300);
            }
        }

        function generateGalleryPhotos() {
            const photoCount = 32;

            for (let i = 1; i <= photoCount; i++) {
                const photoWrapper = document.createElement('div');
                photoWrapper.className = 'float-photo-item cursor-pointer transition-transform duration-300 hover:scale-110 active:scale-95';

                const randomDelay = Math.random() * 3;
                const randomDuration = 4 + Math.random() * 3;
                photoWrapper.style.animationDelay = `${randomDelay}s`;
                photoWrapper.style.animationDuration = `${randomDuration}s`;

                const imgSrc = `img${i}.jpg`;

                photoWrapper.innerHTML = `
                    <div class="heart-mask w-20 h-20 sm:w-24 sm:h-24 p-1 bg-gradient-to-tr from-pink-500 via-rose-400 to-pink-300 flex items-center justify-center shadow-lg">
                        <div class="heart-mask w-full h-full bg-pink-100 flex items-center justify-center overflow-hidden relative">
                            <img src="${imgSrc}" 
                                 alt="Memory ${i}" 
                                 class="w-full h-full object-cover"
                                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'flex flex-col items-center justify-center w-full h-full bg-pink-200 text-pink-600 text-xs font-bold\'><i class=\'fa-solid fa-heart text-sm mb-1\'></i>#${i}</div>';" />
                        </div>
                    </div>
                `;

                // Click photo to Lightbox
                photoWrapper.addEventListener('click', () => {
                    openLightbox(imgSrc, `Memory #${i}`);
                });

                galleryGrid.appendChild(photoWrapper);
            }
        }

        // Lightbox Functions
        const lightboxModal = document.getElementById('lightbox-modal');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');

        function openLightbox(src, caption) {
            lightboxImg.src = src;
            lightboxCaption.textContent = caption;
            lightboxModal.classList.remove('hidden');
            setTimeout(() => lightboxModal.classList.remove('opacity-0'), 10);
            
            confetti({
                particleCount: 25,
                spread: 50,
                origin: { y: 0.5 }
            });
        }

        function closeLightbox() {
            lightboxModal.classList.add('opacity-0');
            setTimeout(() => lightboxModal.classList.add('hidden'), 300);
        }
    </script>
</body>
</html>
